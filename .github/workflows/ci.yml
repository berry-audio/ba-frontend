name: ci

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsc -b type-checks, vite build bundles; output lands in
      # ../berryaudio/web/www per vite.config.ts
      - name: Type-check and build
        run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dist
        run: npm run build

      - name: Package dist
        run: |
          tar czf "berryaudio-ui-dist-${GITHUB_REF_NAME}.tgz" -C ../berryaudio/web/www .

      - uses: softprops/action-gh-release@v2
        with:
          files: berryaudio-ui-dist-*.tgz
          generate_release_notes: true
